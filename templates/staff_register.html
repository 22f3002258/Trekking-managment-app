{% extends "layout.html" %}
{% block title %}Staff Registration{% endblock %}
{% block main %}
<div class="container mt-4" style="max-width:450px;">
    <h3>Staff Registration</h3>
    <form method="POST">
        <div class="mb-2">
            <label>Full Name</label>
            <input type="text" name="fullname" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Phone</label>
            <input type="tel" name="phone" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Confirm Password</label>
            <input type="password" name="confirmation" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Emergency Contact</label>
            <input type="tel" name="emergency" class="form-control" required>
        </div>
        <div class="mb-2">
            <label>Experience (yrs)</label>
            <input type="number" name="experience" class="form-control" required min="0">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="text-muted">⏳ Pending Admin approval before dashboard access</p>
    <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
