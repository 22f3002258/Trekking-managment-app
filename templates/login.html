{% extends "layout.html" %}
{% block title %}
login
{% endblock%}
{% block main%}
    <form action="{{url_for('login')}}" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="email" placeholder="Email" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Log In</button>
    </form>
    <p>Don't have an account?
        <a href="{{ url_for('register') }}">Register as Trekker</a> |
        <a href="{{ url_for('staff_register') }}">Register as Staff</a>
    </p>
{% endblock%}
