{% extends "layout.html" %}
{% block title %}Edit Profile{% endblock %}
{% block main %}
<div class="container mt-4" style="max-width:450px;">
    <h3>Edit Profile</h3>
    <form method="POST">
        <div class="mb-2">
            <label>Full Name</label>
            <input type="text" name="fullname" class="form-control" value="{{ user.full_name }}" required>
        </div>
        <div class="mb-2">
            <label>Phone</label>
            <input type="tel" name="phone" class="form-control" value="{{ user.phone_no }}" required>
        </div>
        <div class="mb-2">
            <label>Emergency Contact</label>
            <input type="tel" name="emergency" class="form-control" value="{{ user.emergency_contact }}" required>
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
    </form>
</div>
{% endblock %}
